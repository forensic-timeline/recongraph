name: Run Tests

on:
  push:
    branches:
      - main
    paths:
      - 'recongraph/**'
      - 'tests/**'
      - 'README.md'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'recongraph/**'
      - 'tests/**'
      - 'README.md'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install pytest
          python -m pip install .

      - name: Run Tests
        run: pytest -v
